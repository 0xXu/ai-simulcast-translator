name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  desktop:
    name: Desktop verification
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pin to 24.15.0: Node 24.16+ has a known regression in extract-zip
          # that causes electron's postinstall to silently fail (path.txt not created).
          # See: https://github.com/electron/electron/issues/51619
          node-version: "24.15.0"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check text format
        run: pnpm format:check

      - name: Lint workspace delivery rules
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm -r test:run

      - name: Build desktop app
        run: pnpm build

      - name: Install Electron binary for smoke test
        working-directory: apps/desktop
        run: |
          electron_dir=$(node -p "require.resolve('electron/package.json').replace('/package.json','')")
          electron_ver=$(node -p "require('electron/package.json').version")
          arch=$(uname -m | sed 's/x86_64/x64/')
          zip_url="https://github.com/electron/electron/releases/download/v${electron_ver}/electron-v${electron_ver}-darwin-${arch}.zip"

          # Re-download with system unzip to avoid extract-zip Node compatibility issues
          echo "Downloading Electron v${electron_ver} (${arch})..."
          curl -fsSL "${zip_url}" -o /tmp/electron.zip
          rm -rf "${electron_dir}/dist"
          unzip -q /tmp/electron.zip -d "${electron_dir}/dist"
          printf 'Electron.app/Contents/MacOS/Electron' > "${electron_dir}/path.txt"

          # Verify
          binary="${electron_dir}/dist/$(cat "${electron_dir}/path.txt")"
          test -f "${binary}" && echo "✅ Electron binary ready: ${binary}" || (echo "❌ Binary not found: ${binary}" && exit 1)

      - name: Run Electron smoke test
        run: pnpm test:e2e

      - name: Verify reproducible demo artifacts
        run: pnpm verify:demo

  asr-worker:
    name: ASR Worker tests
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Worker unit tests
        run: uv run --project workers/asr --extra dev pytest
