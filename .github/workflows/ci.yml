name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  desktop:
    name: Desktop verification
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check text format
        run: pnpm format:check

      - name: Lint workspace delivery rules
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm -r test:run

      - name: Build desktop app
        run: pnpm build

      - name: Run Electron smoke test
        run: pnpm test:e2e

      - name: Verify reproducible demo artifacts
        run: pnpm verify:demo

  asr-worker:
    name: ASR Worker tests
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Worker unit tests
        run: uv run --project workers/asr --extra dev pytest
